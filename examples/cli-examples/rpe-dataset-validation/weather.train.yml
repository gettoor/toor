      reasoning: The weather is sunny.

  - id: train-cloudy
    vars:
      text: The weather is cloudy.
    expected-response:
      response: negative
      reasoning: The weather is cloudy.

  - id: train-weather-unknown
    vars:
      text: I haven't checked the weather today.
