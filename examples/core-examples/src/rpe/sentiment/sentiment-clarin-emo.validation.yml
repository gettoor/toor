- id: validation-terrible-family-hotel-stay
  expected-response:
    response: negative
  vars:
    input: >-
      Wybralismy sie z rodzinä i malutkim dzieckiem w listopadzie 2016 do Charlotty w
      celu spedzenia milego weekendu.Po 1 nocy zrezygnowalismy z pobytu...dlaczego..?oto
      kilka punktöw: W hotelu bylo chlodno,restauracja sprawiala wrazenie zamknietej,
      zimnej i pozbawionej jakiejkolwiek atmosfery;na prosbe mojä wläczono muzyke,jeden
      kelner mial problem z obslużeniem 2 stoliköw,aczkolwiek mily;jedzenie marne,i
      improwizowane(sznycel wiedenski z salatkä ziemniaczanä) czytaj pöl kotleta i
      ziemniaki z musztardä ?!?..deser stary (panacotta).bufet wieczorny...widac na
      zdjeciach,wyschniety chleb,nieschlodzone wedliny i sery,bardzo nieapetycznie
      podane,wrecz niezjadliwe.poköj (apartament)cena 1314 zl za 2 noce...brudna
      wykladzina ,gryzäcy zapach (odswiezacz..?!?)nieszczelne drzwi tarasowe,poplamione
      reczniki,miekki materac w lözku(posciel czysta),mimo canal +,4 programy,reszta
      czarno-biala,lodöwka -minibar-pusta,papierki po poprzednikach za szafkä,pajeczyny
      w rogach.....uff......basen ...1 wrazenie ok...ale woda w jakuzzi pieniäca
      sie...(bakterie) fuj.....;woda w basenie ciepla,ale po wläczeniu wodospadu znowu
      piana.moze ten hotel latem jest ok,ale w okresie jesiennym jest bardzo smutny.

