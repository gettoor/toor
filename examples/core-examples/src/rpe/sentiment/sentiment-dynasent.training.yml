# transforming it into Toor's dataset format.

entries:
- id: training-avoid-bad-place
  expected-response:
    response: negative
  vars:
    input: >-
      Please if you have other options and want to avoid aggravation go
      elsewhere. This place sucks.

- id: training-eager-to-return
  expected-response:
    response: positive
  vars:
    input: I tried a new place. I can't wait to return and try more.

- id: training-incomplete-suggestion
  expected-response:
    response: neutral
  vars:
    input: You should have

- id: training-unsafe-valuables-storage
  expected-response:
    response: negative
  vars:
    input: >-
      Please be very careful on choosing to store your valuables at this
      location. This place sucks.

- id: training-works-very-well
  expected-response:
    response: positive
  vars:
    input: It work very well

- id: training-say-so
  expected-response:
    response: neutral
  vars:
    input: say so

- id: training-restaurant-food-poisoning
  expected-response:
    response: negative
  vars:
    input: I got food posisoning from restaurant. I felt so sick and horrible.

- id: training-welcoming-bar-staff
  expected-response:
    response: positive
  vars:
    input: >-
      And we all did...one by one and went to bar bar that has a welcoming
      atmosphere with polite & pleasant staff! impressed

- id: training-family-platter-portions
  expected-response:
    response: neutral
  vars:
    input: Family platter was good for about 6ppl. WE had too many people.

- id: training-overpriced-bad-food
  expected-response:
    response: negative
  vars:
    input: Food was barely passable and grossly overpriced.bad

- id: training-perfect-food-taste
  expected-response:
    response: positive
  vars:
    input: Everything tasted like pure perfection.

- id: training-waiting-turn
  expected-response:
    response: neutral
  vars:
    input: You told me I would be next

- id: training-avoid-mr-chop-chop
  expected-response:
    response: negative
  vars:
    input: >-
      With so many options available, I only order Mr. Chop Chop when some one
      else insists. It is horrible.

- id: training-delicious-pumpkin-flavour
  expected-response:
    response: positive
  vars:
    input: >-
      It has the perfect amount of pumpkin flavour and you can see the little
      specks of orange from the real pumpkin. It is really good.

- id: training-unclear-observation
  expected-response:
    response: neutral
  vars:
    input: they are looking it

- id: training-rude-ignoring-staff
  expected-response:
    response: negative
