- id: training-contact-hotel-manager
  expected-response:
    response: neutral
  vars:
    input: i call the hotel manager

- id: training-bad-movie-review
  expected-response:
    response: negative
  vars:
    input: That movie was bad.  I own all three.

- id: training-frequent-visits-loved
  expected-response:
    response: positive
  vars:
    input: I come here at least once a week. loved it