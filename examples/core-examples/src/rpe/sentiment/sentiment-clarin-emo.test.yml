- id: test-excellent-pregnancy-doctor-care
  expected-response:
    response: positive
  vars:
    input: >-
      Jestem pacjętką doktora od 3 lat i naprawdę jestem zadowolona jest miły kompetentny
      do gabinetu na babanie ide na luzie bez stresu :) prowadzi mi ciążę chodzę do gabinetu
      na św.wojciecha ale usg robiłam prywatnie w medicusie zależało mi na tym żeby zrobić
      usg 4D i mieć pewność że wszystko jest wporządku pierwsze usg robiłam w 12 tyg było
      ok następne w 18tyg pomierzył wszystko co trzeba powiedział że będe miała córcie ale
      nie podobało mu się serce więc podał mi namiary na bardzo dobrego specjalistę od echa
      serca płodu w szczecinie i miałam pojechać na wizytę w międzyczasie dowiedział się że
      ze skierowaniem nie będę musiała płacić za badanie wypisał mi skierowanie i powiedział
      żebym umówiła sie na wizytę w 20tyg a nastepnego dnia po wizycie w Szczecinie mam przyjść
      do gabinetu z opisem co i jak.Po badaniu w Szczecinie doktor stwierdził że plamka jest
      ale jest nie grożna kamień spadł mi z serca.Natępnego dnia poszłam do doktora z opisem
      od specjalisty ze Szczecina widziałam w jego oczach tez ulge że wszytko jest wporządku.Naprawdę
      szczerze polecam świetny doktor .

