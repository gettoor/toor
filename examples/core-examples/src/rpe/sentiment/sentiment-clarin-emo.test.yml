- id: test-poor-doctor-treatment
  expected-response:
    response: negative
  vars:
    input: >-
      byłam u pana doktora w lutym na usg,stwierdził ciążę obumarłą,z kpiną w głosie i uśmieszkiem
      na twarzy powiedział 'tak to jest jak jest się po trzydziestce" skierował do szpitala.po
      łyżeczkowaniu i 1 okresie poszłam na wizytę kontrolną,a on mi na to,że mnie nie przyjmie,bo
      im się pieniądze z funduszu skończyły i mam przyjść za 3tyg. obecnie jestem w 16tc.byłam
      w poradni,bo od paru dni nie czułam ruchów synka(a czułam je od 2 tyg regularnie) panie
      pielęgniarki pół godz skakały nade mną z detektorem i sprawdzały tętno,niestety nic
      nie wyczuły.pan doktor nie zbadał mnie na usg,nawet nie obejrzał mojego brzucha...bo
      miał wywiad do jakiejś gazety!!!!nie miał czasu!kazał tylko iść do szpitala na ostry
      dyżur. mój mąż jest wściekły,ja zrozpaczona całą tą sytuacją.

