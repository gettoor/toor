      title: Junior React Developer
      seniority: junior
      role: frontend
      requiredSkills:
        - React
        - HTML
        - CSS
      preferredSkills:
        - TypeScript
    reasoning: The posting explicitly names a Junior React Developer. React, HTML,
      and CSS are required foundations, while TypeScript is only nice to have.
  vars:
    jobDescription: We are looking for a Junior React Developer to support the
      development of our web applications. You will implement smaller UI
      features, fix styling issues, write tests, and learn our engineering
      practices through regular code reviews. Candidates need a solid
      understanding of React, HTML, and CSS, demonstrated through
      professional, academic, or personal projects. We are open to people
      starting their software careers. TypeScript knowledge is nice to have.

- id: validation-senior-backend-dotnet-sqlserver
