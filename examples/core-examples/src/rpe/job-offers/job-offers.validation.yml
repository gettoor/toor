      title: Senior Backend Developer
      seniority: senior
      role: backend
      requiredSkills:
        - C#
        - .NET
        - SQL Server
      preferredSkills:
        - Azure
    reasoning: The title explicitly gives Senior Backend Developer. C#, .NET, and
      SQL Server are required, while Azure is preferred.
  vars:
    jobDescription: We are seeking a Senior Backend Developer for an enterprise
      application team. You will design new backend functionality, improve
      existing services, troubleshoot production issues, and support other
      engineers through code reviews and technical discussions. Extensive
      experience with C#, .NET, and SQL Server is required. Candidates should
      be able to own complex backend work without close supervision.
      Experience building or operating applications on Azure is preferred.

- id: validation-qa-api-testing
  expected-response:
