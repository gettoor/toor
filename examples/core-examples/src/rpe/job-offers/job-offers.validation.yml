      title: ML Engineer
      seniority: mid
      role: ml
      requiredSkills:
        - Python
        - TensorFlow
      preferredSkills:
        - PyTorch
    reasoning: The description explicitly calls this a mid-level ML Engineer role.
      Python and TensorFlow are required, while PyTorch is a bonus.
  vars:
    jobDescription: Our machine learning team is looking for an ML Engineer to help
      develop and productionize models used by customer-facing features. You
      will implement training workflows, evaluate models, improve inference
      code, and work closely with data and application engineers. Strong
      Python programming skills and practical TensorFlow experience are
      required. This is a mid-level role for someone who can independently
      deliver well-defined ML engineering projects. PyTorch experience would
      be a bonus.

- id: validation-junior-frontend-react
  expected-response:
