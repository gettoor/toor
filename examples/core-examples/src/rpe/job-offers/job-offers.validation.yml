entries:
- id: validation-senior-backend-node-typescript
  expected-response:
    response:
      title: Senior Node.js Engineer
      seniority: senior
      role: backend
      requiredSkills:
        - Node.js
        - TypeScript
      preferredSkills:
        - Redis
    reasoning: The title explicitly states Senior Node.js Engineer and the
      responsibilities are backend-focused. Node.js and TypeScript are
      essential, while Redis is described as useful rather than required.
  vars:
    jobDescription: We are looking for a Senior Node.js Engineer to join the team
      responsible for our core API platform. You will design backend features,
      review technical proposals, improve service reliability, and support
      other engineers with difficult implementation problems. Strong
      professional experience with Node.js and TypeScript is essential.
      Candidates should be comfortable taking ownership of complex backend
      changes from initial design to production. Experience using Redis in
      production systems would be useful.

- id: validation-frontend-react-javascript
  expected-response:
    response:
      title: Frontend Developer
      seniority: mid
      role: frontend
      requiredSkills:
        - React
        - JavaScript
      preferredSkills:
        - Tailwind CSS
    reasoning: The description explicitly identifies a mid-level Frontend Developer.
      React and JavaScript are required, while Tailwind CSS is only a plus.
  vars:
    jobDescription: Our frontend team is hiring a mid-level Frontend Developer to
      build responsive interfaces for our web platform. You will implement new
      customer-facing functionality, improve existing components, work from
      product designs, and participate in code reviews. Solid commercial
      experience with React and JavaScript is required. You should be able to
      deliver frontend features independently while collaborating closely with
      the rest of the team. Familiarity with Tailwind CSS is a plus.

- id: validation-junior-fullstack-react-node
  expected-response:
    response:
      title: Junior Full Stack Engineer
      seniority: junior
      role: fullstack
      requiredSkills:
        - JavaScript
        - React
        - Node.js
      preferredSkills:
        - PostgreSQL
    reasoning: The title explicitly gives Junior Full Stack Engineer and the tasks
      span frontend and backend. JavaScript, React, and Node.js are required,
      while PostgreSQL is preferred.
  vars:
    jobDescription: We are looking for a Junior Full Stack Engineer to join a small
      product team building an internal business platform. You will work on
      frontend components, simple backend endpoints, bug fixes, and automated
      tests with support from senior engineers. A practical understanding of
      JavaScript, React, and Node.js is required. Commercial experience is
      welcome but not essential. Previous exposure to PostgreSQL through work,
      education, or personal projects is preferred.

- id: validation-lead-devops-aws-kubernetes
  expected-response:
    response:
      title: Lead DevOps Engineer
      seniority: lead
      role: devops
      requiredSkills:
        - Terraform
        - AWS
        - Kubernetes
      preferredSkills:
        - Helm
    reasoning: The title explicitly identifies a Lead DevOps Engineer. Terraform,
      AWS, and Kubernetes are required, while Helm is described as
      advantageous.
  vars:
    jobDescription: We are seeking a Lead DevOps Engineer to guide infrastructure
      improvements across several engineering teams. You will remain hands-on
      while defining deployment practices, reviewing infrastructure changes,
      solving reliability issues, and helping other engineers improve
      operational processes. Deep experience with Terraform, AWS, and
      Kubernetes is required. The role requires both technical leadership and
      strong production troubleshooting skills. Previous experience managing
      Kubernetes deployments with Helm would be advantageous.

- id: validation-senior-data-engineer-kafka
  expected-response:
    response:
      title: Senior Data Engineer
      seniority: senior
      role: data
      requiredSkills:
        - Python
        - SQL
        - Apache Kafka
      preferredSkills:
        - Apache Spark
    reasoning: The posting explicitly states Senior Data Engineer. Python, SQL, and
      Apache Kafka are required, while Apache Spark is desirable.
  vars:
    jobDescription: We are hiring a Senior Data Engineer to help evolve a platform
      that processes data from several business systems. You will design
      reliable pipelines, improve processing performance, establish data
      quality practices, and collaborate with analysts and application
      engineers. Strong production experience with Python, SQL, and Apache
      Kafka is required. You should be comfortable making architectural
      decisions around data processing. Experience using Apache Spark is
      desirable.

- id: validation-ml-engineer-tensorflow
  expected-response:
