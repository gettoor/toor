      title: QA Engineer
      seniority: mid
      role: qa
      requiredSkills:
        - Manual Testing
        - API Testing
      preferredSkills:
        - Postman
    reasoning: The description explicitly states this QA Engineer role is mid-level.
      Manual testing and API testing are required, while Postman is preferred.
  vars:
    jobDescription: Our product team is looking for a QA Engineer to help validate
      web and API-based features before release. You will plan test scenarios,
      execute regression testing, investigate defects with developers, and
      improve the team's overall testing practices. Practical experience with
      manual testing and API testing is required. This is a mid-level role
      where you will independently own testing for assigned features.
      Knowledge of Postman is preferred.

- id: validation-android-kotlin
