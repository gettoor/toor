entries:
- id: test-backend-node-postgres-rest
  expected-response:
    response:
      title: Backend Software Engineer
      seniority: mid
      role: backend
      requiredSkills:
        - Node.js
        - PostgreSQL
        - REST APIs
      preferredSkills:
        - GraphQL
    reasoning: The position is explicitly a mid-level Backend Software Engineer.
      Node.js, PostgreSQL, and REST APIs are required, while GraphQL is
      explicitly optional.
  vars:
    jobDescription: We are hiring a Backend Software Engineer to help develop
      services used by our customer-facing applications. You will design and
      implement APIs, improve existing backend functionality, write automated
      tests, and participate in technical discussions with the team. Strong
      commercial experience with Node.js, PostgreSQL, and REST APIs is
      required. This is a mid-level position with ownership of complete
      backend features. GraphQL experience is optional but would be valuable.

- id: test-senior-frontend-react-typescript
  expected-response:
    response:
      title: Senior Frontend Engineer
      seniority: senior
      role: frontend
      requiredSkills:
        - React
        - TypeScript
      preferredSkills:
        - Vite
    reasoning: The title explicitly states Senior Frontend Engineer. React and
      TypeScript are required, while Vite experience is a plus.
  vars:
    jobDescription: We are looking for a Senior Frontend Engineer to join a team
      responsible for a modern web application used daily by thousands of
      customers. You will implement complex features, improve frontend
      architecture and performance, conduct code reviews, and mentor other
      engineers. Deep experience with React and TypeScript is required.
      Candidates should be capable of leading frontend initiatives
      independently. Previous experience using Vite in production applications
      would be a plus.

- id: test-fullstack-python-django-react
  expected-response:
