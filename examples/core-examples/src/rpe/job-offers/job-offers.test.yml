      title: Full Stack Developer
      seniority: mid
      role: fullstack
      requiredSkills:
        - Python
        - Django
        - React
      preferredSkills:
        - Docker
    reasoning: The description explicitly identifies a mid-level Full Stack
      Developer working across frontend and backend. Python, Django, and React
      are required, while Docker is preferred.
  vars:
    jobDescription: Our product engineering team is looking for a Full Stack
      Developer to build new features across our web platform. This mid-level
      role includes backend development, frontend implementation, bug
      investigation, automated testing, and participation in code reviews.
      Strong practical experience with Python, Django, and React is required.
      You should be comfortable taking a feature from specification through
      implementation. Experience working with Docker would be preferred.

- id: test-junior-devops-linux-docker
