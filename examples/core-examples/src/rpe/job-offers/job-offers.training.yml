- id: training-junior-qa-selenium
  expected-response:
    response:
      title: Junior QA Engineer
      seniority: junior
      role: qa
      requiredSkills:
        - Software Testing
        - Selenium
      preferredSkills:
        - Playwright
    reasoning: The job is explicitly a Junior QA Engineer. Software testing
      knowledge and Selenium are required, while Playwright is described only
      as a bonus.
  vars:
    jobDescription: We are looking for a Junior QA Engineer to join an agile product
      team and help us maintain a high level of software quality. You will
      execute test scenarios, report defects, assist with regression testing,
      and gradually contribute to automated test coverage. Basic knowledge of
      software testing concepts and practical familiarity with Selenium are
      required. We welcome candidates at the beginning of their professional
      careers. Any previous experience with Playwright would be a bonus.

- id: training-senior-android-kotlin
