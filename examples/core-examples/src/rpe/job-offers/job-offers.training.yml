entries:
- id: training-senior-backend-node-typescript
  expected-response:
    response:
      title: Senior Backend Engineer
      seniority: senior
      role: backend
      requiredSkills:
        - Node.js
        - TypeScript
        - PostgreSQL
      preferredSkills:
        - Redis
    reasoning: The title explicitly states Senior Backend Engineer, establishing
      seniority and backend role. Node.js, TypeScript, and PostgreSQL are
      explicitly required, while Redis is described as a plus.
  vars:
    jobDescription: We are looking for a Senior Backend Engineer to join a team
      building high-volume services for our SaaS platform. You will design
      APIs, improve existing services, review code, and work closely with
      product and frontend engineers. Strong commercial experience with
      Node.js, TypeScript, and PostgreSQL is required. You should be
      comfortable taking ownership of backend features from design through
      production. Experience with Redis for caching or high-throughput
      workloads would be a plus.

- id: training-junior-frontend-js-html-css
  expected-response:
    response:
      title: Junior Frontend Developer
      seniority: junior
      role: frontend
      requiredSkills:
        - JavaScript
        - HTML
        - CSS
      preferredSkills:
        - React
    reasoning: The posting explicitly names a Junior Frontend Developer. JavaScript,
      HTML, and CSS form the required foundation, while React is explicitly
      preferred rather than required.
  vars:
    jobDescription: We are hiring a Junior Frontend Developer to help develop
      customer-facing web applications. You will implement designs, fix UI
      issues, write reusable components, and collaborate with more experienced
      developers during code reviews. Candidates should have a good foundation
      in JavaScript, HTML, and CSS, including experience gained through
      personal, academic, or commercial projects. Previous exposure to React
      is preferred but is not required for the role.

- id: training-fullstack-react-node-postgres
  expected-response:
    response:
      title: Full Stack Engineer
      seniority: mid
      role: fullstack
      requiredSkills:
        - React
        - Node.js
        - PostgreSQL
      preferredSkills:
        - Docker
    reasoning: The description explicitly identifies a mid-level Full Stack Engineer
      working across frontend and backend. React, Node.js, and PostgreSQL are
      required, while Docker is only beneficial.
  vars:
    jobDescription: Our product team is looking for a mid-level Full Stack Engineer
      to work across our customer portal and supporting services. You will
      build new features, maintain existing functionality, and participate in
      technical design discussions with the rest of the engineering team.
      Practical experience with React, Node.js, and PostgreSQL is required. We
      value engineers who can comfortably move between frontend and backend
      work. Experience using Docker in development or production environments
      would be beneficial.

- id: training-senior-devops-kubernetes-terraform
  expected-response:
    response:
      title: Senior DevOps Engineer
      seniority: senior
      role: devops
      requiredSkills:
        - Kubernetes
        - Docker
        - Terraform
      preferredSkills:
        - AWS
    reasoning: The title explicitly gives Senior DevOps Engineer. Kubernetes,
      Docker, and Terraform are directly required, whereas AWS is described
      only as an advantage.
  vars:
    jobDescription: We are seeking a Senior DevOps Engineer to improve the
      reliability and delivery processes of our cloud-based products. You will
      maintain deployment pipelines, automate infrastructure changes, support
      engineering teams, and help improve the resilience of production
      environments. Strong hands-on experience with Kubernetes, Docker, and
      Terraform is required. You should be comfortable troubleshooting
      distributed production systems and reviewing infrastructure changes.
      Previous experience working with AWS would be an advantage.

- id: training-data-engineer-python-spark
  expected-response:
    response:
      title: Data Engineer
      seniority: mid
      role: data
      requiredSkills:
        - Python
        - SQL
        - Apache Spark
      preferredSkills:
        - Apache Airflow
    reasoning: The position is a Data Engineer and no junior or senior qualifier is
      given, so mid is used. Python, SQL, and Apache Spark are mandatory,
      while Apache Airflow is explicitly nice to have.
  vars:
    jobDescription: We are expanding our data platform team and are looking for a
      Data Engineer to build and maintain pipelines used by analytics and
      product teams. The role includes processing large datasets, improving
      data quality, and developing reliable batch and streaming workflows.
      Candidates must have strong experience with Python, SQL, and Apache
      Spark. You should understand how to design maintainable data pipelines
      and diagnose performance issues. Experience orchestrating workflows with
      Apache Airflow is nice to have.

- id: training-ml-engineer-python-pytorch
  expected-response:
    response:
      title: Machine Learning Engineer
      seniority: mid
      role: ml
      requiredSkills:
        - Python
        - PyTorch
      preferredSkills:
        - TensorFlow
    reasoning: The title and duties identify a Machine Learning Engineer, with no
      explicit junior or senior level, so mid is appropriate. Python and
      PyTorch are required, while TensorFlow is explicitly non-required.
  vars:
    jobDescription: We are looking for a Machine Learning Engineer to help turn
      experimental models into production-ready features. You will work with
      data scientists and software engineers on model training, evaluation,
      deployment, and ongoing improvements. Strong Python skills and practical
      experience building models with PyTorch are required. The ideal
      candidate understands common machine learning workflows and can write
      maintainable production code. Familiarity with TensorFlow would be
      useful but is not a requirement.

- id: training-senior-frontend-react-typescript
  expected-response:
    response:
      title: Senior React Developer
      seniority: senior
      role: frontend
      requiredSkills:
        - React
        - TypeScript
        - CSS
      preferredSkills:
        - Next.js
    reasoning: Senior React Developer is explicitly stated and the work is
      frontend-focused. React, TypeScript, and CSS are mandatory, while
      Next.js is explicitly preferred.
  vars:
    jobDescription: We are hiring a Senior React Developer for a team responsible
      for a large browser-based business application. You will design reusable
      UI components, improve application performance, mentor other frontend
      engineers, and participate in architecture decisions. Advanced
      experience with React, TypeScript, and CSS is mandatory. You should be
      comfortable working with complex stateful interfaces and reviewing
      frontend code. Commercial experience with Next.js is preferred and would
      help you contribute to several upcoming initiatives.

